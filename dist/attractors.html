<title>Strange Attractors</title>
<style>

  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--bg);

  body.idle { cursor: none; }

    text-shadow: 0 1px 12px rgba(0,0,0,.45);

  #name {
    font-size: 1.45rem;
    font-weight: 600;
    letter-spacing: -0.012em;
    margin: 0 0 .45rem;
  }
  #eq {
    font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    font-size: .8rem;
    white-space: pre-wrap;
    opacity: .92;
    margin: 0 0 .45rem;
  }
  #params {
    font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    font-size: .74rem;
    opacity: .7;
    margin: 0 0 .5rem;
  }
  #ref {
    font-size: .72rem;
    opacity: .55;
    font-style: italic;
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #meta {
    position: fixed;
    right: max(24px, env(safe-area-inset-right));
    bottom: max(22px, env(safe-area-inset-bottom));
    text-align: right;
    font-size: .68rem;
    letter-spacing: .09em;
    text-transform: uppercase;
    opacity: calc(var(--hud) * .6);
    transition: opacity 240ms linear;
    pointer-events: none;
  }
  #meta.hidden { opacity: 0 !important; }
  #meta b { color: var(--accent); font-weight: 600; }

  #help {
    position: fixed;
    top: max(22px, env(safe-area-inset-top));
    left: max(24px, env(safe-area-inset-left));
    font-size: .68rem;
    line-height: 1.7;
    opacity: 0;
    transition: opacity 240ms linear;
    pointer-events: none;
  }
  #help.show { opacity: .5; }
  #help kbd {
    font-family: ui-monospace, Menlo, monospace;
    border: 1px solid currentColor;
    border-radius: 3px;
    padding: 0 .28em;

  }

    --panel-alpha: 1;
    position: fixed;

    right: max(24px, env(safe-area-inset-right));
    width: min(44ch, 34vw);

    pointer-events: none;
    text-shadow: 0 1px 12px rgba(0,0,0,.5);

  #history-head {

    letter-spacing: .13em;
    text-transform: uppercase;
    text-align: right;
    opacity: .45;
    margin-bottom: .7rem;
  }

    height: min(52vh, 480px);

    mask-image: linear-gradient(to bottom, transparent 0, #000 12px, #000 calc(100% - 56px), transparent 100%);
  }

    /* Clears the top of the fade, so the first line is not dimmed at rest. */

    text-align: right;
    will-change: transform;
  }
  #history-origin {
    font-size: .74rem;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: .55rem;
  }
  #history-body p {
    font-size: .765rem;
    line-height: 1.62;
    margin: 0 0 .8rem;
    opacity: .96;
    text-wrap: pretty;
  }
  #history-body p.caveat { font-style: italic; opacity: .66; }
  #history-body p.sources {
    font-size: .64rem;
    letter-spacing: .04em;
    opacity: .5;
    margin-bottom: 3.5rem;
  }

  @media (max-width: 900px), (max-height: 520px) {
    #history { display: none; }
  }

    place-content: center;
    padding: 12vw;
    background: #0b0d12;
    color: #ffb4a8;
    font-family: ui-monospace, Menlo, monospace;
    font-size: .85rem;
    white-space: pre-wrap;
    overflow: auto;
  }
  #error.show { display: grid; }

// Entry point: wiring, the frame loop, quality adaptation and input.

const { createContext } = __req('glutil.js');
const { Scene } = __req('scene.js');
const { Director } = __req('director.js');
const { ATTRACTORS } = __req('attractors.js');
const { Drift } = __req('drift.js');
const { HistoryPanel } = __req('history-panel.js');
const { equations, parameterLine, parameterValues, reference } = __req('format.js');

const params = new URLSearchParams(location.search);
const num = (key, fallback) => {
  const v = parseFloat(params.get(key));
  return Number.isFinite(v) ? v : fallback;
};
const flag = key => params.has(key) && params.get(key) !== '0' && params.get(key) !== 'false';

const OPTS = {
  idle: flag('idle'),
  duration: num('duration', 300),
  fadeTime: num('fade', 1.4),
  continuous: flag('continuous'),
  sweep: num('sweep', 0.12),
  sweepPeriod: Math.max(4, num('sweepPeriod', 55)),
  particles: Math.max(64, Math.min(4096, num('particles', 1024))),
  steps: Math.max(8, Math.min(512, num('steps', 180))),
  speed: num('speed', 1),
  theme: params.get('theme') || 'any',
  attractor: params.get('attractor'),
  maxPixelRatio: num('dpr', 1.75),
  hud: params.get('hud') !== '0',
  history: params.get('history') !== '0'
};

const el = id => document.getElementById(id);

async function boot() {
  const canvas = el('gl');
  const gl = createContext(canvas, { antialias: true });

  // Quality ladder, walked only between shots so changes are never visible.
  const LADDER = [
    { particles: 256, steps: 90 },
    { particles: 512, steps: 120 },
    { particles: 768, steps: 150 },
    { particles: OPTS.particles, steps: OPTS.steps },
    { particles: Math.min(2048, OPTS.particles * 2), steps: Math.min(320, OPTS.steps * 1.5 | 0) }
  ];
  let rung = 3;
  let pendingRung = 3;
  let ceilingRung = LADDER.length - 1;

  const scene = new Scene(gl, LADDER[rung]);

  // --continuous: walk the parameters instead of holding them fixed.
  const drift = OPTS.continuous
    ? new Drift({ amplitude: OPTS.sweep, period: OPTS.sweepPeriod })
    : null;

  const history = OPTS.history ? new HistoryPanel(el('history')) : null;

  const director = new Director(scene, {
    duration: OPTS.duration,
    fadeTime: OPTS.fadeTime,
    theme: OPTS.theme,
    pinned: OPTS.attractor,
    drift,
    quality: () => { rung = pendingRung; return LADDER[rung]; },
    onChange: describe
  });

  function describe(attractor, style, dir) {
    document.documentElement.style.setProperty('--bg', style.palette.css.background);
    document.documentElement.style.setProperty('--fg', style.palette.css.foreground);
    document.documentElement.style.setProperty('--accent', style.palette.css.accent);
    document.body.classList.toggle('paper', !style.palette.dark);
    el('name').textContent = attractor.name;
    el('eq').textContent = equations(attractor).join('\n');
    el('params').textContent = parameterLine(attractor);
    el('ref').textContent = reference(attractor);
    el('counter').textContent =
      `${String(dir.index + 1).padStart(2, '0')} / ${ATTRACTORS.length}`;
    el('palette').textContent = style.palette.name;
    if (history) history.show(attractor);

  // --- sizing --------------------------------------------------------------
  let pixelRatio = 1;
  function resize() {
    pixelRatio = Math.min(window.devicePixelRatio || 1, OPTS.maxPixelRatio);
    const w = Math.max(1, Math.round(canvas.clientWidth * pixelRatio));
    const h = Math.max(1, Math.round(canvas.clientHeight * pixelRatio));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
    scene.camera.aspect = w / h;
    if (scene.style) scene.style.pixelRatio = pixelRatio;
  }
  resize();
  new ResizeObserver(resize).observe(canvas);
  window.addEventListener('resize', resize);

  // --- frame loop ----------------------------------------------------------
  let last = performance.now();
  let accumulator = 0;
  let smoothDt = 1 / 60;
  let sinceCheck = 0;
  let sinceReadout = 0;
  let running = true;

  function frame(now) {
    if (!running) return;
    requestAnimationFrame(frame);

    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;

    if (scene.style) scene.style.pixelRatio = pixelRatio;

    // Integration is pinned to 60 steps/second so the motion looks the same
    // on a 60Hz panel and a 165Hz one.
    if (!director.paused) {
      accumulator += dt * 60 * OPTS.speed;
      let steps = Math.min(4, Math.floor(accumulator));
      accumulator -= steps;
      while (steps-- > 0) scene.sim.step(1);
    } else {
      accumulator = 0;
    }

    scene.camera.update(dt);
    const veil = director.advance(dt);
    scene.render({ veil });

    if (history) history.advance(dt);

    // With the parameters moving, the line under the title is a live readout
    // rather than a caption, so it has to be rewritten — but four times a
    // second, not sixty, or the digits are a blur.
    if (drift && !director.paused) {
      sinceReadout += dt;
      if (sinceReadout > 0.25) {
        sinceReadout = 0;
        el('params').textContent = parameterValues(scene.sim.params);
      }
    }

    const hud = OPTS.hud ? Math.max(0, 1 - veil * 1.6) : 0;
    document.documentElement.style.setProperty('--hud', hud.toFixed(3));

    // Frame-to-frame interval is the only honest signal here: CPU timings say
    // nothing about a GPU-bound draw. Anything past ~46fps costs a rung, and a
    // rung we have already fallen off is never climbed back to.
    if (dt < 0.05) smoothDt += (dt - smoothDt) * 0.05;
    sinceCheck += dt;
    if (sinceCheck > 4) {
      sinceCheck = 0;
      if (smoothDt > 0.0215 && pendingRung > 0) {
        pendingRung--;
        ceilingRung = pendingRung;
      } else if (smoothDt < 0.0125 && pendingRung < ceilingRung) {
        pendingRung++;
      }
    }
  }
  requestAnimationFrame(frame);

  canvas.addEventListener('webglcontextlost', e => {
    e.preventDefault();
    running = false;
    el('error').textContent = 'WebGL context lost. Reload to restart.';
    el('error').classList.add('show');
  });

  // --- input ---------------------------------------------------------------
  if (OPTS.idle) {
    document.body.classList.add('idle');
    armIdleExit();
  } else {
    armControls(canvas, director, scene, history);
  }

  return { scene, director, history, drift };
}

// Screensaver mode: the first real sign of life dismisses the window.
function armIdleExit() {
  const armedAt = performance.now();
  let origin = null;
  let quitting = false;
  const quit = () => {
    if (quitting || performance.now() - armedAt < 700) return;
    quitting = true;
    // The launcher's static server shuts down on /__quit and takes the browser
    // with it; window.close() covers the case where the page is run standalone.
    fetch('/__quit').catch(() => {});
    window.close();
    document.body.classList.remove('idle');
  };
  const moved = e => {
    if (!origin) { origin = [e.clientX, e.clientY]; return; }
    if (Math.hypot(e.clientX - origin[0], e.clientY - origin[1]) > 12) quit();
  };
  window.addEventListener('mousemove', moved, { passive: true });
  for (const type of ['keydown', 'mousedown', 'wheel', 'touchstart', 'pointerdown']) {
    window.addEventListener(type, quit, { passive: true });
  }

function armControls(canvas, director, scene, history) {
  const help = el('help');
  let helpTimer = null;
  const flashHelp = () => {
    help.classList.add('show');
    clearTimeout(helpTimer);
    helpTimer = setTimeout(() => help.classList.remove('show'), 3200);
  };
  flashHelp();

  window.addEventListener('keydown', e => {
    switch (e.key) {
      case 'ArrowRight': case 'n': director.jump(1); break;
      case 'ArrowLeft': case 'p': director.jump(-1); break;
      case 'r': case 'R': director.reshuffleLook(); break;
      case ' ': director.paused = !director.paused; e.preventDefault(); break;
      case 'h': case 'H':
        el('hud').classList.toggle('hidden');
        el('meta').classList.toggle('hidden');
        el('history').classList.toggle('hidden');
        break;
      case 'i': case 'I': el('history').classList.toggle('hidden'); break;
      case 'f': case 'F':
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen().catch(() => {});
        break;
      case '?': flashHelp(); break;
      default: return;
    }
  });

  let dragging = null;
  canvas.addEventListener('pointerdown', e => {
    dragging = [e.clientX, e.clientY];
    scene.camera.drag = true;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e => {
    if (!dragging) return;
    scene.camera.orbitBy(e.clientX - dragging[0], e.clientY - dragging[1]);
    dragging = [e.clientX, e.clientY];
  });
  const release = e => {
    dragging = null;
    scene.camera.drag = false;
    if (e.pointerId !== undefined && canvas.hasPointerCapture(e.pointerId)) {
      canvas.releasePointerCapture(e.pointerId);
    }
  };
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    scene.camera.zoomBy(e.deltaY);
  }, { passive: false });

  // A wheel over the history panel scrolls the text rather than the camera,
  // and holds the automatic scroll off for a few seconds afterwards.
  if (history) {
    el('history').addEventListener('wheel', e => {
      e.preventDefault();
      history.nudge(e.deltaY * 0.6);
    }, { passive: false });
  }
}

Object.assign(__exports, { boot });

__def("glutil.js", function (__exports, __req) {
// Thin WebGL2 helpers: programs with cached uniform locations, float FBOs.

function createContext(canvas, { antialias = true } = {}) {
  const gl = canvas.getContext('webgl2', {
    antialias,
    alpha: false,
    depth: true,
    stencil: false,
    premultipliedAlpha: false,
    preserveDrawingBuffer: false,
    powerPreference: 'high-performance',
    desynchronized: true
  });
  if (!gl) throw new Error('WebGL2 is not available in this browser.');
  if (!gl.getExtension('EXT_color_buffer_float')) {
    throw new Error('EXT_color_buffer_float is required (float render targets).');
  }
  return gl;
}

function compile(gl, type, source) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, source);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(sh);
    const numbered = source.split('\n').map((l, i) => `${String(i + 1).padStart(3)}| ${l}`).join('\n');
    gl.deleteShader(sh);
    throw new Error(`Shader compile failed:\n${log}\n${numbered}`);
  }
  return sh;
}

function program(gl, vert, frag) {
  const p = gl.createProgram();
  const vs = compile(gl, gl.VERTEX_SHADER, vert);
  const fs = compile(gl, gl.FRAGMENT_SHADER, frag);
  gl.attachShader(p, vs);
  gl.attachShader(p, fs);
  gl.linkProgram(p);
  gl.deleteShader(vs);
  gl.deleteShader(fs);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    const log = gl.getProgramInfoLog(p);
    gl.deleteProgram(p);
    throw new Error(`Program link failed:\n${log}`);
  }
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const name = gl.getActiveUniform(p, i).name.replace(/\[0\]$/, '');
    u[name] = gl.getUniformLocation(p, name);
  }
  return { program: p, u, destroy: () => gl.deleteProgram(p) };
}

// RGBA32F render target. NEAREST filtering; we only ever texelFetch it.
function floatTarget(gl, width, height) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA32F, width, height);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  const status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  if (status !== gl.FRAMEBUFFER_COMPLETE) throw new Error(`Incomplete framebuffer: 0x${status.toString(16)}`);

  return {
    tex, fbo, width, height,
    destroy() { gl.deleteTexture(tex); gl.deleteFramebuffer(fbo); }
  };
}

// A single oversized triangle covering the viewport, for fullscreen passes.
function fullscreenTriangle(gl) {
  const vao = gl.createVertexArray();
  const buf = gl.createBuffer();
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-4, -4, 0, 4, 4, -4]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.bindVertexArray(null);
  return { vao, destroy() { gl.deleteVertexArray(vao); gl.deleteBuffer(buf); } };
}

const FULLSCREEN_VERT = `#version 300 es
precision highp float;
layout(location = 0) in vec2 xy;
out vec2 uv;
void main () {
  uv = 0.5 * xy + 0.5;
  gl_Position = vec4(xy, 0, 1);
}`;

function hexToRgb(hex) {
  const h = hex.replace('#', '');
  const v = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
  return [
    parseInt(v.slice(0, 2), 16) / 255,
    parseInt(v.slice(2, 4), 16) / 255,
    parseInt(v.slice(4, 6), 16) / 255
  ];
}

Object.assign(__exports, { createContext, program, floatTarget, fullscreenTriangle, FULLSCREEN_VERT, hexToRgb });

// Frame composition: floor smear, trails, grid room, transition veil.

const { program, fullscreenTriangle, FULLSCREEN_VERT } = __req('glutil.js');
const { Simulation } = __req('simulation.js');
const { TrailRenderer } = __req('lines.js');
const { Stage } = __req('stage.js');
const { Camera } = __req('camera.js');

const VEIL_FRAG = `#version 300 es
precision highp float;
uniform vec4 uColor;
out vec4 fragColor;
void main () { fragColor = uColor; }`;

class Scene {
  constructor(gl, opts) {
    this.gl = gl;
    this.sim = new Simulation(gl, opts);
    this.trails = new TrailRenderer(gl);
    this.stage = new Stage(gl);
    this.camera = new Camera();
    this.quad = fullscreenTriangle(gl);
    this.veil = program(gl, FULLSCREEN_VERT, VEIL_FRAG);
    this.style = null;
  }

  render({ veil = 0 } = {}) {
    const gl = this.gl;
    const style = this.style;
    if (!style) return;

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
    gl.clearColor(style.background[0], style.background[1], style.background[2], 1);
    gl.clearDepth(1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    gl.disable(gl.BLEND);
    gl.enable(gl.SAMPLE_ALPHA_TO_COVERAGE);

    if (style.shadow && this.camera.eye[1] > style.floorY) {
      gl.disable(gl.DEPTH_TEST);
      gl.depthMask(false);
      this.trails.draw(this.sim, this.camera, style, { shadow: true });
      gl.depthMask(true);
    }

    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LEQUAL);
    this.trails.draw(this.sim, this.camera, style, { shadow: false });

    gl.disable(gl.SAMPLE_ALPHA_TO_COVERAGE);

    if (style.gridOpacity > 0.002) this.stage.draw(this.camera, style);

    if (veil > 0.001) {
      gl.disable(gl.DEPTH_TEST);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      gl.useProgram(this.veil.program);

      gl.bindVertexArray(null);

  destroy() {
    this.sim.destroy();
    this.trails.destroy();
    this.stage.destroy();
    this.quad.destroy();
    this.veil.destroy();

__def("simulation.js", function (__exports, __req) {
// GPU state: one RGBA32F texture holding `steps` positions for each of
// `particles` trajectories, advanced with 4th-order Runge-Kutta.
//
// Layout: texel (column, row) = position of particle `row` at trail slot
// `column`. Columns are a ring buffer; `head` is the newest sample.

const { program, floatTarget, fullscreenTriangle, FULLSCREEN_VERT } = __req('glutil.js');

const QUASIRANDOM = `
// http://extremelearning.com.au/unreasonable-effectiveness-of-quasirandom-sequences/
vec3 quasirandom (float n) {
  const float g = 1.22074408460575947536;
  return fract(0.5 + n * vec3(1.0 / g, 1.0 / (g * g), 1.0 / (g * g * g))).zyx;
}
vec3 sphericalRandom (float n) {
  vec3 r = quasirandom(n);
  float u = r.x * 2.0 - 1.0;
  float theta = 6.283185307179586 * r.y;
  return vec3(sqrt(1.0 - u * u) * vec2(cos(theta), sin(theta)), u) * sqrt(r.z);
}`;

const INIT_FRAG = `#version 300 es
precision highp float;
uniform vec2 uResolution;
uniform vec3 uOrigin;
uniform float uScale;
out vec4 fragColor;
${QUASIRANDOM}
void main () {
  // gl_FragCoord carries a half-texel offset, which is welcome here: exactly
  // zero states tend to stick to unstable axes and fly off to infinity.
  float particle = gl_FragCoord.y;
  fragColor = vec4(uOrigin + uScale * sphericalRandom(particle), 1.0);
  // A sliver of variation along each trail so there is something to see on
  // the very first frame.
  fragColor.z -= gl_FragCoord.x / uResolution.x * 0.001;
}`;

const COPY_FRAG = `#version 300 es
precision highp float;
uniform sampler2D uSrc;
out vec4 fragColor;
void main () {
  fragColor = texelFetch(uSrc, ivec2(0, int(gl_FragCoord.y)), 0);
}`;

function integrateFrag(attractor) {
  const params = attractor.params || {};
  const names = Object.keys(params);
  const decls = names.length ? names.map(n => `uniform float ${n};`).join('\n') : '';
  const deriv = attractor.deriv.trim().split('\n').map(l => '    ' + l.trim()).join('\n');
  return `#version 300 es
precision highp float;
uniform sampler2D uSrc;
uniform float uDt, uT;
uniform int uColumn, uSubsteps;
uniform vec3 uOrigin;
out vec4 fragColor;
${decls}
${QUASIRANDOM}

vec3 derivative (float x, float y, float z, float t) {
  return vec3(
${deriv}
  );
}

vec3 D (vec3 p, float t) { return derivative(p.x, p.y, p.z, t); }

void main () {
  int row = int(gl_FragCoord.y);
  vec3 p = texelFetch(uSrc, ivec2(uColumn, row), 0).xyz;
  float t = uT;
  float dt = uDt;

  for (int i = 0; i < uSubsteps; i++) {
    vec3 k1 = D(p, t);
    vec3 k2 = D(p + (0.5 * dt) * k1, t + 0.5 * dt);
    vec3 k3 = D(p + (0.5 * dt) * k2, t + 0.5 * dt);
    vec3 k4 = D(p + dt * k3, t + dt);
    p += (dt / 6.0) * (k1 + k4 + 2.0 * (k2 + k3));
    t += dt;

    // Trajectories that escape get pulled back toward the origin along the
    // same ray; ones that go non-finite are re-seeded from scratch.
    float m = dot(p, p);
    if (!(m < 1e12)) p = uOrigin + sphericalRandom(float(row) + 0.5 + t);
    else if (m > 1e6) p *= 0.0001;
  }
  fragColor = vec4(p, 1.0);
}`;
}

class Simulation {
  constructor(gl, { particles, steps }) {
    this.gl = gl;
    this.particles = particles;
    this.steps = steps;
    this.head = 0;
    this.t = 0;
    this.filled = 0;

    this.state = floatTarget(gl, steps, particles);
    this.tmp = floatTarget(gl, 1, particles);
    this.quad = fullscreenTriangle(gl);
    this.init = program(gl, FULLSCREEN_VERT, INIT_FRAG);
    this.copy = program(gl, FULLSCREEN_VERT, COPY_FRAG);
    this.programs = new Map(); // attractor name -> compiled integrator
    this.attractor = null;
    this.params = {};
  }

  integrator(attractor) {
    let p = this.programs.get(attractor.name);
    if (!p) {
      p = program(this.gl, FULLSCREEN_VERT, integrateFrag(attractor));
      this.programs.set(attractor.name, p);
    }
    return p;
  }

  // Seed every trail slot with a quasirandom blob and reset the clock.
  reset(attractor) {
    const gl = this.gl;
    this.attractor = attractor;
    this.params = { ...(attractor.params || {}) };
    this.head = 0;
    this.t = 0;
    this.filled = 1;

    const origin = attractor.initOrigin || [0, 0, 0];
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.state.fbo);
    gl.viewport(0, 0, this.state.width, this.state.height);
    gl.disable(gl.DEPTH_TEST);
    gl.disable(gl.BLEND);
    gl.useProgram(this.init.program);
    gl.uniform2f(this.init.u.uResolution, this.state.width, this.state.height);
    gl.uniform3fv(this.init.u.uOrigin, origin);
    gl.uniform1f(this.init.u.uScale, attractor.initScale ?? 1);
    gl.bindVertexArray(this.quad.vao);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindVertexArray(null);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  // One RK4 advance of `substeps` internal steps, appended to the ring buffer.
  step(substeps = 1) {
    const gl = this.gl;
    const a = this.attractor;
    if (!a) return;
    const prog = this.integrator(a);

    // Integrate the head column into the scratch target.
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.tmp.fbo);
    gl.viewport(0, 0, 1, this.particles);
    gl.disable(gl.DEPTH_TEST);
    gl.disable(gl.BLEND);
    gl.useProgram(prog.program);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.state.tex);
    gl.uniform1i(prog.u.uSrc, 0);
    gl.uniform1f(prog.u.uDt, a.dt);
    gl.uniform1f(prog.u.uT, this.t);
    gl.uniform1i(prog.u.uColumn, this.head);
    gl.uniform1i(prog.u.uSubsteps, substeps);
    gl.uniform3fv(prog.u.uOrigin, a.initOrigin || [0, 0, 0]);
    for (const [name, value] of Object.entries(this.params)) {
      if (prog.u[name]) gl.uniform1f(prog.u[name], value);
    }
    gl.bindVertexArray(this.quad.vao);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    this.t += a.dt * substeps;
    this.head = (this.head + 1) % this.steps;
    this.filled = Math.min(this.filled + 1, this.steps);

    // Blit the scratch column back into the ring buffer.
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.state.fbo);
    gl.viewport(this.head, 0, 1, this.particles);
    gl.useProgram(this.copy.program);
    gl.bindTexture(gl.TEXTURE_2D, this.tmp.tex);
    gl.uniform1i(this.copy.u.uSrc, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindVertexArray(null);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  // Run the system far enough that the transient has died and the trail is
  // full of on-attractor samples. Chunked so no single draw runs long.
  spinUp(burnIn = 600, chunk = 24) {
    const passes = Math.ceil(burnIn / chunk);
    for (let i = 0; i < passes; i++) this.step(chunk);
    for (let i = 0; i < this.steps; i++) this.step(1);
  }

  // Pull the trail buffer back to the CPU so the camera can frame the shape
  // it actually settled into, rather than the notebook's hand-tuned guess.
  //
  // `maxRows` reads only the first few trajectories. The full readback is a few
  // megabytes and costs a visible hitch, which is fine between shots but not
  // during one; --continuous mode reframes on the move and asks for a slice.
  readPositions(maxRows = this.particles) {
    const gl = this.gl;
    const rows = Math.max(1, Math.min(this.particles, Math.floor(maxRows)));
    const out = new Float32Array(this.steps * rows * 4);
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.state.fbo);
    gl.readPixels(0, 0, this.steps, rows, gl.RGBA, gl.FLOAT, out);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return out;
  }

  resize({ particles, steps }) {
    if (particles === this.particles && steps === this.steps) return;
    this.state.destroy();
    this.tmp.destroy();
    this.particles = particles;
    this.steps = steps;
    this.state = floatTarget(this.gl, steps, particles);
    this.tmp = floatTarget(this.gl, 1, particles);
  }

  destroy() {
    this.state.destroy();
    this.tmp.destroy();
    this.quad.destroy();
    this.init.destroy();
    this.copy.destroy();
    for (const p of this.programs.values()) p.destroy();
    this.programs.clear();
  }
}

Object.assign(__exports, { Simulation });

});

__def("lines.js", function (__exports, __req) {
// Trail renderer. Every visible segment and every joint is an instanced quad
// whose corners are placed in screen space by the vertex shader, so line width
// is in pixels and independent of depth. Round joints come from an SDF the
// fragment shader turns into alpha, resolved by alpha-to-coverage against the
// multisampled default framebuffer -- that keeps the pass opaque, so trails can
// depth-test against each other without any sorting.

const { program } = __req('glutil.js');

const VERT = `#version 300 es
precision highp float;
precision highp int;

layout(location = 0) in vec2 corner;   // (0..1, 0..1)

uniform mat4 uProjView, uTransform;
uniform sampler2D uState;
uniform ivec4 uRing;      // steps, particles, head, filled
uniform int uSegsPerTrail, uMode, uShadow;
uniform vec2 uResolution; // device pixels
uniform float uWidth, uFade, uTailFade, uColorMode, uFloorY;
uniform vec3 uColor1, uColor2, uBackground, uShadowColor;

out vec2 vLineCoord;
out float vWidth, vShade;
out vec4 vColor;

vec3 quasirandom (float n) {
  const float g = 1.22074408460575947536;
  return fract(0.5 + n * vec3(1.0 / g, 1.0 / (g * g), 1.0 / (g * g * g))).zyx;
}

vec4 clipOf (int particle, int slot) {
  int column = (uRing.z + 1 + slot) % uRing.x;
  vec4 world = uTransform * vec4(texelFetch(uState, ivec2(column, particle), 0).xyz, 1.0);
  if (uShadow == 1) world.y = uFloorY;
  return uProjView * world;
}

float widthAt (float param) {
  return uWidth * exp(-3.0 * uFade * (1.0 - param));
}

void main () {
  int steps = uRing.x;
  int particle = gl_InstanceID / uSegsPerTrail;
  int slot = gl_InstanceID - particle * uSegsPerTrail;

  // Slots older than what has actually been simulated are collapsed away.
  bool alive = slot >= steps - uRing.w;

  float denom = float(steps - 1);
  float paramA = float(slot) / denom;
  float paramB = float(slot + 1) / denom;
  float pn = (float(particle) + 0.5) / float(uRing.y);

  vec4 clipA = clipOf(particle, slot);
  vec4 clipB = uMode == 0 ? clipOf(particle, slot + 1) : clipA;

  if (!alive || clipA.w <= 0.0 || clipB.w <= 0.0) {
    gl_Position = vec4(0.0, 0.0, 2.0, 1.0);  // behind the far plane: clipped
    vLineCoord = vec2(0.0);
    vWidth = 1.0;
    vShade = 0.0;
    vColor = vec4(0.0);
    return;
  }

  vec2 halfRes = 0.5 * uResolution;
  vec2 pxA = (clipA.xy / clipA.w) * halfRes;
  vec2 pxB = (clipB.xy / clipB.w) * halfRes;
  float zA = clipA.z / clipA.w;
  float zB = clipB.z / clipB.w;

  float along, across, param, z;
  vec2 px;

  if (uMode == 0) {
    along = corner.x;
    across = corner.y * 2.0 - 1.0;
    param = mix(paramA, paramB, along);
    vWidth = widthAt(param);
    vec2 d = pxB - pxA;
    float len = length(d);
    vec2 dir = len > 1e-5 ? d / len : vec2(1.0, 0.0);
    px = mix(pxA, pxB, along) + vec2(-dir.y, dir.x) * across * (0.5 * vWidth);
    z = mix(zA, zB, along);
    vLineCoord = vec2(0.0, across);
    vShade = across;
  } else {
    vec2 c = corner * 2.0 - 1.0;
    param = paramA;
    vWidth = widthAt(param);
    px = pxA + c * (0.5 * vWidth);
    // Nudged away from the eye so the segments drawn afterwards win wherever
    // they overlap, leaving only the part of the disc that is a real joint.
    z = zA + 1e-5;
    vLineCoord = c;

    // Shade the disc across the stroke, not radially, so a joint does not
    // read as a bead threaded onto the line.
    int neighbour = slot < steps - 1 ? slot + 1 : slot - 1;
    vec4 clipN = clipOf(particle, neighbour);
    vec2 tangent = vec2(1.0, 0.0);
    if (clipN.w > 0.0) {
      vec2 delta = (clipN.xy / clipN.w) * halfRes - pxA;
      if (length(delta) > 1e-5) tangent = normalize(delta);
    }
    vShade = dot(c, vec2(-tangent.y, tangent.x));
  }

  // Per-trail depth nudge, so trails that overlap exactly do not z-fight.
  z -= 0.0001 * abs(pn - 0.5);

  gl_Position = vec4(px / halfRes, z, 1.0);

  if (uShadow == 1) {
    vColor = vec4(uShadowColor, 1.0);
  } else {
    float coord = mix(quasirandom(float(particle) + 0.5).z, pn, uColorMode);
    vec3 rgb = mix(uColor1, uColor2, coord);
    rgb = mix(rgb, uBackground, uTailFade * pow(1.0 - param, 0.7));
    vColor = vec4(rgb, 1.0);
  }
}`;

const FRAG = `#version 300 es
precision highp float;
precision highp int;

in vec2 vLineCoord;
in float vWidth, vShade;
in vec4 vColor;

uniform int uShadow;
uniform float uShading;
uniform vec2 uBorderWidth;
uniform vec4 uBorderColor;

out vec4 fragColor;

float linearstep (float a, float b, float x) { return clamp((x - a) / (b - a), 0.0, 1.0); }

void main () {
  float sdf = length(vLineCoord);

  if (uShadow == 1) {
    fragColor = vec4(vColor.rgb, linearstep(1.0, 1.0 - 2.0 / vWidth, sdf));
    return;
  }

  // A cheap cylindrical highlight across the width of the stroke.
  float highlight = 1.0 - vShade * vShade;
  float shade = mix(1.0, highlight, uShading);
  shade = mix(shade, 1.0, uShading * highlight * 0.7);

  vec2 threshold = 1.0 - uBorderWidth / vWidth;
  float isBorder = linearstep(threshold.x, threshold.y, sdf);

  vec3 rgb = mix(vColor.rgb * shade, uBorderColor.rgb, isBorder * uBorderColor.a);
  fragColor = vec4(rgb, linearstep(1.0, 1.0 - 2.0 / vWidth, sdf));
}`;

class TrailRenderer {
  constructor(gl) {
    this.gl = gl;
    this.prog = program(gl, VERT, FRAG);
    this.vao = gl.createVertexArray();
    this.buf = gl.createBuffer();
    gl.bindVertexArray(this.vao);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 0, 1, 1, 0, 1, 1]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.vertexAttribDivisor(0, 0);
    gl.bindVertexArray(null);
  }

  draw(sim, camera, style, { shadow = false } = {}) {
    const gl = this.gl;
    const { u, program: p } = this.prog;
    const dpr = style.pixelRatio;
    const width = Math.max(0.5, style.width * dpr);

    gl.useProgram(p);
    gl.bindVertexArray(this.vao);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, sim.state.tex);

    gl.uniform1i(u.uState, 0);
    gl.uniformMatrix4fv(u.uProjView, false, camera.projView);
    gl.uniformMatrix4fv(u.uTransform, false, style.transform);
    gl.uniform4i(u.uRing, sim.steps, sim.particles, sim.head, sim.filled);
    gl.uniform2f(u.uResolution, gl.drawingBufferWidth, gl.drawingBufferHeight);
    gl.uniform1f(u.uWidth, shadow ? width * 1.05 : width);
    gl.uniform1f(u.uFade, style.fade);
    gl.uniform1f(u.uTailFade, shadow ? 0 : style.tailFade);
    gl.uniform1f(u.uColorMode, style.colorBy === 'random' ? 1 : 0);
    gl.uniform1f(u.uFloorY, style.floorY);
    gl.uniform3fv(u.uColor1, style.color1);
    gl.uniform3fv(u.uColor2, style.color2);
    gl.uniform3fv(u.uBackground, style.background);
    gl.uniform3fv(u.uShadowColor, style.shadowColor);
    gl.uniform1i(u.uShadow, shadow ? 1 : 0);
    gl.uniform1f(u.uShading, style.shading);
    gl.uniform2f(u.uBorderWidth,
      2.0 * style.borderWidth * dpr + 0.75,
      2.0 * style.borderWidth * dpr - 0.75);
    gl.uniform4f(u.uBorderColor, ...style.borderColor, style.borderOpacity);

    // Joints first, segments over them: what remains of a disc is exactly the
    // wedge a corner needs, plus the round caps at either end of a trail.
    gl.uniform1i(u.uSegsPerTrail, sim.steps);
    gl.uniform1i(u.uMode, 1);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, sim.particles * sim.steps);

    gl.uniform1i(u.uSegsPerTrail, sim.steps - 1);
    gl.uniform1i(u.uMode, 0);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, sim.particles * (sim.steps - 1));

    gl.bindVertexArray(null);
  }

  destroy() {
    this.prog.destroy();
    this.gl.deleteVertexArray(this.vao);
    this.gl.deleteBuffer(this.buf);
  }
}

Object.assign(__exports, { TrailRenderer });

});

__def("stage.js", function (__exports, __req) {
// The room the attractor sits in: a box of faint grid paper, drawn only on the
// far side of the camera so it reads as a backdrop and floor rather than a cage.
// Ported from the notebook's "fancy axes" cell.

const { program } = __req('glutil.js');
const mat4 = __req('mat4.js');

const VERT = `#version 300 es
precision highp float;

layout(location = 0) in vec3 position;
layout(location = 1) in vec3 normal;
layout(location = 2) in vec3 tangent;
layout(location = 3) in vec3 bitangent;

uniform mat4 uProjView, uModel;
uniform mat3 uNormalMatrix;

out vec2 vCoord;
out vec3 vPos, vNormal;

void main () {
  vPos = (uModel * vec4(position, 1.0)).xyz;
  vNormal = uNormalMatrix * normal;
  vCoord = vec2(dot(position, bitangent), dot(position, tangent));
  gl_Position = uProjView * vec4(vPos, 1.0);
}`;

const FRAG = `#version 300 es
precision highp float;

in vec2 vCoord;
in vec3 vPos, vNormal;

uniform vec3 uEye, uGridColor;
uniform float uOpacity, uGridScale;

out vec4 fragColor;

float gridFactor (vec2 parameter, float width) {
  vec2 d = fwidth(parameter);
  vec2 looped = 0.5 - abs(mod(parameter, 1.0) - 0.5);
  vec2 a2 = smoothstep(d * (width + 0.5), d * (width - 0.5), looped);
  return max(a2.x, a2.y);
}

void main () {
  vec3 n = normalize(vNormal);
  float vDotN = dot(normalize(vPos - uEye), n);

  // Only the walls behind the subject; the ones between us and it are dropped.
  if (vDotN < 0.0) discard;

  float fade = smoothstep(0.02, 0.25, vDotN);
  // Cell size stays fixed in world units however large the room gets.
  float alpha = fade * uOpacity * (
    gridFactor(vCoord * 4.0 * uGridScale, 0.5) +
    0.2 * gridFactor(vCoord * 40.0 * uGridScale, 0.5)
  );
  if (alpha < 0.002) discard;
  fragColor = vec4(uGridColor, alpha);
}`;

function boxGeometry() {
  const position = [], normal = [], tangent = [], bitangent = [], index = [];
  const basis = [
    [1, 0, 0],
    [0, 1, 0],
    [0, 0, 1]
  ];
  for (let axis = 0; axis < 3; axis++) {
    const n = basis[axis];
    const t = basis[(axis + 1) % 3];
    const b = basis[(axis + 2) % 3];
    for (const sign of [1, -1]) {
      const base = position.length / 3;
      for (const [su, sv] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
        position.push(
          sign * n[0] + su * t[0] + sv * b[0],
          sign * n[1] + su * t[1] + sv * b[1],
          sign * n[2] + su * t[2] + sv * b[2]
        );
        normal.push(sign * n[0], sign * n[1], sign * n[2]);
        tangent.push(...t);
        bitangent.push(...b);
      }
      index.push(base, base + 1, base + 2, base, base + 2, base + 3);
    }
  }
  return { position, normal, tangent, bitangent, index };
}

class Stage {
  constructor(gl) {
    this.gl = gl;
    this.prog = program(gl, VERT, FRAG);

    const g = boxGeometry();
    this.count = g.index.length;
    this.vao = gl.createVertexArray();
    gl.bindVertexArray(this.vao);
    this.buffers = [];
    [g.position, g.normal, g.tangent, g.bitangent].forEach((data, loc) => {
      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 3, gl.FLOAT, false, 0, 0);
      this.buffers.push(buf);
    });
    this.ibo = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.ibo);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(g.index), gl.STATIC_DRAW);
    gl.bindVertexArray(null);

    this.model = mat4.create();
    this.normalMatrix = new Float32Array(9);
    this.shaped = null;
  }

  // A cube of half-extent `half` whose underside rests on `floorY`.
  shape(half, floorY) {
    const key = `${half}:${floorY}`;
    if (this.shaped === key) return;
    this.shaped = key;
    mat4.scale(this.model, mat4.fromTranslation(mat4.create(), [0, floorY + half, 0]), [half, half, half]);
    mat4.normalFromMat4(this.normalMatrix, this.model);
  }

  draw(camera, style) {
    const gl = this.gl;
    const { u, program: p } = this.prog;
    this.shape(style.roomHalf, style.floorY);
    gl.useProgram(p);
    gl.bindVertexArray(this.vao);
    gl.uniformMatrix4fv(u.uProjView, false, camera.projView);
    gl.uniformMatrix4fv(u.uModel, false, this.model);

// Orbit camera with a slow, never-quite-repeating drift.

  constructor() {

    this.distance = 3.2;
    this.theta = 0.9;       // azimuth
    this.phi = 0.32;        // elevation, radians above the horizon
    this.fov = Math.PI / 4;
    this.aspect = 1;

    this.dTheta = 0.0022;   // radians per frame at 60fps
    this.phiCenter = 0.32;
    this.phiSwing = 0.22;
    this.phiRate = 0.11;
    this.clock = 0;

    this.eye = new Float32Array(3);
    this.view = mat4.create();
    this.projection = mat4.create();
    this.projView = mat4.create();
    this.drag = null;
  }

  // Randomise the vantage point without ever ducking under the floor.
  randomize(rng = Math.random) {
    this.theta = rng() * Math.PI * 2;
    this.phiCenter = 0.12 + rng() * 0.5;
    this.phiSwing = 0.06 + rng() * 0.22;
    this.phiRate = 0.06 + rng() * 0.12;
    this.dTheta = (rng() < 0.5 ? -1 : 1) * (0.0012 + rng() * 0.0022);
    this.distance = 2.9 + rng() * 0.9;
    this.clock = rng() * 100;
  }

    this.clock += dt;
    if (!this.drag) {
      this.theta += this.dTheta * dt * 60;
      this.phi = this.phiCenter + this.phiSwing * Math.sin(this.clock * this.phiRate);

    const cp = Math.cos(this.phi), sp = Math.sin(this.phi);

    this.eye[2] = this.target[2] + this.distance * cp * Math.sin(this.theta);

// different palette and camera move, and cross-fades between them.

const { PALETTES } = __req('palettes.js');

  const a = arr.slice();

    const j = Math.floor(rng() * (i + 1));

// cannot push the camera into the next county.

  const count = positions.length / 4;
  const stride = Math.max(1, Math.ceil(count / maxSamples));
  const radii = [];
  const heights = [];
  for (let i = 0; i < count; i += stride) {
    const x = positions[i * 4], y = positions[i * 4 + 1], z = positions[i * 4 + 2];
    if (!Number.isFinite(x) || !Number.isFinite(y) || !Number.isFinite(z)) continue;

    const wz = m[2] * x + m[6] * y + m[10] * z + m[14];

        this.load(this.current);
        this.phase = 'in';

    }

  }

  { name: 'Aurora',     dark: true, bg: '#040a0c', c1: '#1a7ba6', c2: '#a7ffcf', border: '#010607', grid: '#48a0a8' },
  // --- paper --------------------------------------------------------------
  { name: 'Notebook',   dark: false, bg: '#ffffff', c1: '#2f6ad0', c2: '#8de2a7', border: '#492727', grid: '#000000' },
  { name: 'Blueprint',  dark: false, bg: '#eef3fa', c1: '#123a73', c2: '#5fb0d8', border: '#12243d', grid: '#20406b' },
  { name: 'Risograph',  dark: false, bg: '#f7f1e6', c1: '#d0245c', c2: '#2a4fc4', border: '#3a2018', grid: '#6b5a48' }
];

function mix(a, b, t) { return a.map((v, i) => v + (b[i] - v) * t); }

const PALETTES = raw.map(p => {
  const background = hexToRgb(p.bg);
  const color1 = hexToRgb(p.c1);
  const color2 = hexToRgb(p.c2);
  return {
    name: p.name,
    dark: p.dark,
    background,
    color1,
    color2,
    borderColor: hexToRgb(p.border),
    gridColor: hexToRgb(p.grid),
    gridOpacity: p.dark ? 0.32 : 0.25,
    // On dark grounds a literal shadow is invisible, so the floor catches a

    shadowColor: p.dark ? mix(background, color1, 0.42) : mix(background, [0, 0, 0], 0.09),

});

const pick = (rng = Math.random, filter = () => true) => {

};

Object.assign(__exports, { PALETTES, pick });
