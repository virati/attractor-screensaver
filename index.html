<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strange Attractors</title>
<style>
  :root {
    --bg: #07090e;
    --fg: #e8edf5;
    --accent: #8de2a7;
    --hud: 0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    transition: background-color 400ms linear;
  }
  body.idle { cursor: none; }
  canvas {
    display: block;
    width: 100%; height: 100%;
    touch-action: none;
  }

  #hud {
    position: fixed;
    left: max(24px, env(safe-area-inset-left));
    bottom: max(22px, env(safe-area-inset-bottom));
    max-width: min(52ch, calc(100vw - 48px));
    max-height: 38vh;
    opacity: var(--hud);
    transition: opacity 240ms linear;
    pointer-events: none;
    text-shadow: 0 1px 12px rgba(0,0,0,.45);
    line-height: 1.45;
  }
  body.paper #hud { text-shadow: 0 1px 10px rgba(255,255,255,.7); }
  #hud.hidden { opacity: 0 !important; }

  #name {
    font-size: 1.45rem;
    font-weight: 600;
    letter-spacing: -0.012em;
    margin: 0 0 .45rem;
  }
  #eq {
    font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    font-size: .8rem;
    white-space: pre-wrap;
    opacity: .92;
    margin: 0 0 .45rem;
  }
  #params {
    font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    font-size: .74rem;
    opacity: .7;
    margin: 0 0 .5rem;
  }
  #ref {
    font-size: .72rem;
    opacity: .55;
    font-style: italic;
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #meta {
    position: fixed;
    right: max(24px, env(safe-area-inset-right));
    bottom: max(22px, env(safe-area-inset-bottom));
    text-align: right;
    font-size: .68rem;
    letter-spacing: .09em;
    text-transform: uppercase;
    opacity: calc(var(--hud) * .6);
    transition: opacity 240ms linear;
    pointer-events: none;
  }
  #meta.hidden { opacity: 0 !important; }
  #meta b { color: var(--accent); font-weight: 600; }

  #help {
    position: fixed;
    top: max(22px, env(safe-area-inset-top));
    left: max(24px, env(safe-area-inset-left));
    font-size: .68rem;
    line-height: 1.7;
    opacity: 0;
    transition: opacity 240ms linear;
    pointer-events: none;
  }
  #help.show { opacity: .5; }
  #help kbd {
    font-family: ui-monospace, Menlo, monospace;
    border: 1px solid currentColor;
    border-radius: 3px;
    padding: 0 .28em;
    opacity: .85;
  }

  #history {
    --panel-alpha: 1;
    position: fixed;
    top: max(22px, env(safe-area-inset-top));
    right: max(24px, env(safe-area-inset-right));
    width: min(44ch, 34vw);
    opacity: calc(var(--hud) * var(--panel-alpha));
    transition: opacity 240ms linear;
    pointer-events: none;
    text-shadow: 0 1px 12px rgba(0,0,0,.5);
  }
  body.paper #history { text-shadow: 0 1px 10px rgba(255,255,255,.75); }
  body:not(.idle) #history { pointer-events: auto; }
  #history.hidden, #history.empty { opacity: 0 !important; }

  /* The heading stays put; only the text below it moves, which is why the
     mask lives on the viewport rather than on the panel as a whole. */
  #history-head {
    font-size: .62rem;
    letter-spacing: .13em;
    text-transform: uppercase;
    text-align: right;
    opacity: .45;
    margin-bottom: .7rem;
  }

  #history-view {
    height: min(52vh, 480px);
    overflow: hidden;
    /* The text is meant to drift out of sight rather than be cut off, so both
       ends of the viewport dissolve into the background. */
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 12px, #000 calc(100% - 56px), transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0, #000 12px, #000 calc(100% - 56px), transparent 100%);
  }

  #history-track {
    /* Clears the top of the fade, so the first line is not dimmed at rest. */
    padding-top: 14px;
    text-align: right;
    will-change: transform;
  }
  #history-origin {
    font-size: .74rem;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: .55rem;
  }
  #history-body p {
    font-size: .765rem;
    line-height: 1.62;
    margin: 0 0 .8rem;
    opacity: .96;
    text-wrap: pretty;
  }
  #history-body p.caveat { font-style: italic; opacity: .66; }
  #history-body p.sources {
    font-size: .64rem;
    letter-spacing: .04em;
    opacity: .5;
    margin-bottom: 3.5rem;
  }

  /* Below this width the panel would cover the subject, so it stands down. */
  @media (max-width: 900px), (max-height: 520px) {
    #history { display: none; }
  }

  #error {
    position: fixed; inset: 0;
    display: none;
    place-content: center;
    padding: 12vw;
    background: #000;
    color: #ffb4a8;
    font-family: ui-monospace, Menlo, monospace;
    font-size: .85rem;
    white-space: pre-wrap;
    overflow: auto;
  }
  #error.show { display: grid; }
</style>
</head>
<body>
  <canvas id="gl"></canvas>

  <div id="hud">
    <h1 id="name"></h1>
    <pre id="eq"></pre>
    <div id="params"></div>
    <div id="ref"></div>
  </div>

  <div id="meta"><span id="counter"></span> · <b id="palette"></b></div>

  <aside id="history">
    <div id="history-head">History and details</div>
    <div id="history-view">
      <div id="history-track">
        <div id="history-origin"></div>
        <div id="history-body"></div>
      </div>
    </div>
  </aside>

  <div id="help">
    <div><kbd>←</kbd> <kbd>→</kbd> previous / next attractor</div>
    <div><kbd>R</kbd> new colours &amp; camera</div>
    <div><kbd>space</kbd> hold this one</div>
    <div><kbd>H</kbd> hide overlay · <kbd>F</kbd> fullscreen</div>
    <div><kbd>I</kbd> history panel · <kbd>scroll</kbd> over it to read</div>
    <div><kbd>drag</kbd> orbit · <kbd>scroll</kbd> zoom</div>
  </div>

  <div id="error"></div>

  <script type="module">
    import { boot } from './src/main.js';
    boot().catch(err => {
      const el = document.getElementById('error');
      el.textContent = String(err && err.stack || err);
      el.classList.add('show');
      console.error(err);
    });
  </script>
</body>
</html>
